<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
>

<title>Deltarune Dialogue</title>

<style>

@font-face {

    font-family: "8-bit Operator JVE";

    src: url("8bitoperator_jve.ttf") format("truetype");

}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    color: white;

}

body {

    display: flex;

    justify-content: center;

    align-items: center;

    touch-action: manipulation;

    font-family:
        "8-bit Operator JVE",
        monospace;

}

#game {

    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: #000;

}


/* ==========================================
   DIALOGUE BOX
========================================== */

#dialogueBox {

    position: absolute;

    left: 50%;

    bottom: 2.5%;

    transform: translateX(-50%);

    width: 92%;

    z-index: 10;

}

#dialogueBackground {

    display: block;

    width: 100%;

    height: auto;

}

#character {

    position: absolute;

    left: 5%;

    bottom: 7%;

    width: 20%;

    height: 75%;

    object-fit: contain;

    object-position: bottom center;

    image-rendering: pixelated;

}

#dialogueText {

    position: absolute;

    left: 29%;

    right: 6%;

    top: 24%;

    bottom: 17%;

    color: white;

    font-family:
        "8-bit Operator JVE",
        monospace;

    font-size:
        clamp(
            15px,
            2.4vw,
            32px
        );

    line-height: 1.35;

    white-space: pre-wrap;

    overflow-wrap: break-word;

    overflow: hidden;

}

#continueIndicator {

    position: absolute;

    right: 3%;

    bottom: 7%;

    font-size: 20px;

    display: none;

    animation:
        blink .8s infinite;

}

@keyframes blink {

    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: 0;
    }

}


/* ==========================================
   EVENTS
========================================== */

#eventOverlay {

    position: absolute;

    inset: 0;

    z-index: 20;

    display: none;

    justify-content: center;

    align-items: center;

    background: #000;

}

#eventText {

    font-family:
        "8-bit Operator JVE",
        monospace;

    font-size:
        clamp(
            18px,
            4vw,
            40px
        );

    text-align: center;

}


/* ==========================================
   ERROR
========================================== */

#errorScreen {

    position: absolute;

    inset: 0;

    z-index: 100;

    display: none;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    padding: 25px;

    text-align: center;

    background: #000;

    font-family:
        "8-bit Operator JVE",
        monospace;

}

#errorScreen button {

    margin-top: 20px;

    padding: 12px 20px;

    background: white;

    color: black;

    border: 0;

    font-family:
        "8-bit Operator JVE",
        monospace;

}


/* ==========================================
   MOBILE
========================================== */

@media (max-width: 700px) {

    #dialogueBox {

        width: 96%;

        bottom: 2%;

    }

    #character {

        left: 4%;

        width: 22%;

        height: 72%;

    }

    #dialogueText {

        left: 29%;

        right: 5%;

        top: 24%;

        bottom: 17%;

        font-size:
            clamp(
                10px,
                3.3vw,
                20px
            );

    }

}

</style>

</head>


<body>


<div id="game">


    <div id="dialogueBox">

        <img
            id="dialogueBackground"
            src="https://i.ibb.co/21Z5G7Yn/Untitled7-20260815081350.png"
            alt=""
        >

        <img
            id="character"
            src=""
            alt=""
        >

        <div id="dialogueText"></div>

        <div id="continueIndicator">
            ▼
        </div>

    </div>


    <div id="eventOverlay">

        <div id="eventText"></div>

    </div>


    <div id="errorScreen">

        <div id="errorMessage">
            No dialogue project was found.
        </div>

        <button
            onclick="location.href='index.html'"
        >
            BACK TO GENERATOR
        </button>

    </div>

</div>


<script>


/* ==========================================
   CHARACTER DATA
========================================== */

const characters = {

    susie: {

        sprites: {

            neutral:
                "https://i.ibb.co/G4nYggzv/IMG-0004.jpg",

            mad:
                "https://i.ibb.co/gFHhswgR/IMG-0005.jpg",

            evil_1:
                "https://i.ibb.co/tPcV6xPn/IMG-0006.jpg",

            evil_2:
                "https://i.ibb.co/wZrZJrDd/IMG-0007.jpg",

            evil_3:
                "https://i.ibb.co/bRrjQF5B/IMG-0008.jpg",

            goofyMad:
                "https://i.ibb.co/Jj3mHthd/IMG-0009.jpg",

            awkward:
                "https://i.ibb.co/Cp225DcB/IMG-0010.jpg",

            madEvil:
                "https://i.ibb.co/5gYCTqtx/IMG-0012.jpg"

        }

    },


    ralsei: {

        sprites: {

            happy:
                "https://i.ibb.co/G3fVqRj7/IMG-0014.jpg",

            happyBlush:
                "https://i.ibb.co/5xxjf0kk/IMG-0013.jpg",

            shockWorried:
                "https://i.ibb.co/gMxqsXtF/IMG-0015.jpg",

            yell:
                "https://i.ibb.co/k66gNgxL/IMG-0016.jpg",

            disappoint:
                "https://i.ibb.co/4RQGNnv3/IMG-0017.jpg"

        }

    }

};


/* ==========================================
   ELEMENTS
========================================== */

const dialogueText =
    document.getElementById(
        "dialogueText"
    );

const characterImage =
    document.getElementById(
        "character"
    );

const continueIndicator =
    document.getElementById(
        "continueIndicator"
    );

const eventOverlay =
    document.getElementById(
        "eventOverlay"
    );

const eventText =
    document.getElementById(
        "eventText"
    );

const errorScreen =
    document.getElementById(
        "errorScreen"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );


/* ==========================================
   PROJECT VARIABLES
========================================== */

let sequence = [];

let currentIndex = 0;

let currentText = "";

let typingPosition = 0;

let typing = false;

let typingTimer = null;


/* ==========================================
   LOAD PROJECT
========================================== */

function loadProject() {

    const saved =
        localStorage.getItem(
            "deltaruneDialogueProject"
        );


    if (!saved) {

        showError(
            "No dialogue project was found. Go back to the generator and press Generate Dialogue."
        );

        return false;

    }


    try {

        const data =
            JSON.parse(
                saved
            );


        if (
            !data ||
            !Array.isArray(
                data.sequence
            ) ||
            data.sequence.length === 0
        ) {

            throw new Error(
                "Invalid project"
            );

        }


        sequence =
            data.sequence;


        return true;

    }

    catch (error) {

        console.error(
            error
        );

        showError(
            "The dialogue project could not be loaded."
        );

        return false;

    }

}


/* ==========================================
   ERROR
========================================== */

function showError(message) {

    errorMessage.textContent =
        message;

    errorScreen.style.display =
        "flex";

}


/* ==========================================
   START ENTRY
========================================== */

function startEntry() {

    currentIndex = 0;

    playEntry();

}


/* ==========================================
   PLAY ENTRY
========================================== */

function playEntry() {

    stopTyping();


    if (
        currentIndex >=
        sequence.length
    ) {

        finishGame();

        return;

    }


    const entry =
        sequence[currentIndex];


    if (!entry) {

        nextEntry();

        return;

    }


    if (
        entry.type ===
        "event"
    ) {

        playEvent(
            entry
        );

        return;

    }


    playDialogue(
        entry
    );

}


/* ==========================================
   PLAY DIALOGUE
========================================== */

function playDialogue(entry) {

    eventOverlay.style.display =
        "none";


    const character =
        characters[
            entry.character
        ];


    if (!character) {

        nextEntry();

        return;

    }


    const sprite =
        character.sprites[
            entry.sprite
        ];


    if (sprite) {

        characterImage.src =
            sprite;

        characterImage.style.display =
            "block";

    }

    else {

        characterImage.style.display =
            "none";

    }


    currentText =
        String(
            entry.text || ""
        );


    dialogueText.textContent =
        "";


    continueIndicator.style.display =
        "none";


    /*
       IMPORTANT:
       Typing begins immediately.
       No audio.
       No start screen.
       No delayed initialization.
    */

    typing =
        true;

    typingPosition =
        0;


    typeCharacter();

}


/* ==========================================
   TYPE CHARACTER
========================================== */

function typeCharacter() {

    if (!typing) {
        return;
    }


    if (
        typingPosition >=
        currentText.length
    ) {

        finishTyping();

        return;

    }


    dialogueText.textContent +=
        currentText[
            typingPosition
        ];


    typingPosition++;


    /*
       30ms per character gives a
       Deltarune-style quick typing feel.
    */

    typingTimer =
        setTimeout(
            typeCharacter,
            30
        );

}


/* ==========================================
   FINISH TYPING
========================================== */

function finishTyping() {

    stopTyping();


    dialogueText.textContent =
        currentText;


    continueIndicator.style.display =
        "block";

}


/* ==========================================
   STOP TYPING
========================================== */

function stopTyping() {

    typing =
        false;


    if (
        typingTimer !== null
    ) {

        clearTimeout(
            typingTimer
        );

    }


    typingTimer =
        null;

}


/* ==========================================
   ADVANCE
========================================== */

function advance() {

    /*
       If text is still typing,
       the first tap/Enter instantly
       finishes it.
    */

    if (typing) {

        finishTyping();

        return;

    }


    currentIndex++;

    playEntry();

}


/* ==========================================
   EVENTS
========================================== */

function playEvent(entry) {

    stopTyping();


    dialogueText.textContent =
        "";


    characterImage.style.display =
        "none";


    continueIndicator.style.display =
        "none";


    eventOverlay.style.display =
        "flex";


    eventText.textContent =
        entry.text || "";


    const duration =
        Number(
            entry.duration
        ) || 1000;


    if (
        entry.eventType ===
        "shake"
    ) {

        shakeScreen(
            duration
        );

    }


    setTimeout(
        function() {

            eventOverlay.style.display =
                "none";


            nextEntry();

        },
        duration
    );

}


/* ==========================================
   SHAKE EVENT
========================================== */

function shakeScreen(duration) {

    const game =
        document.getElementById(
            "game"
        );


    const start =
        performance.now();


    function shake(time) {

        const elapsed =
            time - start;


        if (
            elapsed >=
            duration
        ) {

            game.style.transform =
                "";

            return;

        }


        const x =
            (Math.random() - .5)
            * 8;


        const y =
            (Math.random() - .5)
            * 8;


        game.style.transform =
            `translate(${x}px, ${y}px)`;


        requestAnimationFrame(
            shake
        );

    }


    requestAnimationFrame(
        shake
    );

}


/* ==========================================
   NEXT
========================================== */

function nextEntry() {

    currentIndex++;

    playEntry();

}


/* ==========================================
   FINISH
========================================== */

function finishGame() {

    stopTyping();


    dialogueText.textContent =
        "";


    characterImage.style.display =
        "none";


    continueIndicator.style.display =
        "none";


    eventOverlay.style.display =
        "none";

}


/* ==========================================
   KEYBOARD
========================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            advance();

        }

    }
);


/* ==========================================
   MOBILE TAP
========================================== */

document.getElementById(
    "game"
).addEventListener(
    "click",
    function() {

        advance();

    }
);


/* ==========================================
   INITIALIZE
========================================== */

if (
    loadProject()
) {

    /*
       Start immediately.
       This fixes the first-dialogue issue.
    */

    startEntry();

}

</script>

</body>

</html>
