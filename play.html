<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Dialogue Player</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;

    color: white;

    user-select: none;
    -webkit-user-select: none;

}

body {

    display: flex;

    justify-content: center;
    align-items: flex-end;

}

#game {

    position: relative;

    width: 100%;
    height: 100%;

    background: black;

    display: flex;

    justify-content: center;

    align-items: flex-end;

}


/* =========================
   DIALOGUE BOX
========================= */

.dialogue {

    position: relative;

    width: min(100vw, 1100px);

    margin-bottom: 12px;

    display: none;

}

.dialogue-background {

    width: 100%;

    height: auto;

    display: block;

}


/* =========================
   CHARACTER
========================= */

.character {

    position: absolute;

    left: 5%;

    bottom: 8%;

    width: 20%;

    height: 72%;

    object-fit: contain;

    object-position: bottom center;

    image-rendering: pixelated;

}


/* =========================
   TEXT
========================= */

.text {

    position: absolute;

    left: 29%;

    right: 6%;

    top: 25%;

    bottom: 18%;

    color: white;

    font-family:
        "8-bit Operator JVE",
        "Courier New",
        monospace;

    font-size:
        clamp(14px, 2.4vw, 28px);

    line-height: 1.35;

    white-space: pre-wrap;

    overflow: hidden;

}


/* =========================
   CONTINUE
========================= */

#continueIndicator {

    position: absolute;

    right: 3%;

    bottom: 8%;

    font-size: 18px;

    display: none;

    animation: blink 0.8s infinite;

}

@keyframes blink {

    50% {
        opacity: 0.2;
    }

}


/* =========================
   EVENTS
========================= */

#eventScreen {

    position: absolute;

    inset: 0;

    background: black;

    display: none;

    justify-content: center;

    align-items: center;

    z-index: 50;

}

.event-text {

    font-family:
        "8-bit Operator JVE",
        "Courier New",
        monospace;

    font-size:
        clamp(18px, 4vw, 40px);

    text-align: center;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .dialogue {

        width: 100%;

        margin-bottom: 5px;

    }

    .text {

        font-size:
            clamp(10px, 3.2vw, 18px);

    }

    .character {

        width: 21%;

    }

}

</style>

</head>

<body>


<div id="game">


    <div
        id="dialogue"
        class="dialogue"
    >

        <img
            class="dialogue-background"
            src="https://i.ibb.co/21Z5G7Yn/Untitled7-20260815081350.png"
        >


        <img
            id="character"
            class="character"
            src=""
        >


        <div
            id="text"
            class="text"
        ></div>


        <div
            id="continueIndicator"
        >
            ▼
        </div>

    </div>


    <div
        id="eventScreen"
    >

        <div
            id="eventText"
            class="event-text"
        ></div>

    </div>

</div>


<script>


/* ==================================================
   SPRITES
================================================== */

const characters = {

    susie: {

        neutral:
            "https://i.ibb.co/G4nYggzv/IMG-0004.jpg",

        mad:
            "https://i.ibb.co/gFHhswgR/IMG-0005.jpg",

        evil_1:
            "https://i.ibb.co/tPcV6xPn/IMG-0006.jpg",

        evil_2:
            "https://i.ibb.co/wZrZJrDd/IMG-0007.jpg",

        evil_3:
            "https://i.ibb.co/bRrjQF5B/IMG-0008.jpg",

        goofyMad:
            "https://i.ibb.co/Jj3mHthd/IMG-0009.jpg",

        awkward:
            "https://i.ibb.co/Cp225DcB/IMG-0010.jpg",

        madEvil:
            "https://i.ibb.co/5gYCTqtx/IMG-0012.jpg"

    },


    ralsei: {

        happy:
            "https://i.ibb.co/G3fVqRj7/IMG-0014.jpg",

        happyBlush:
            "https://i.ibb.co/5xxjf0kk/IMG-0013.jpg",

        shockWorried:
            "https://i.ibb.co/gMxqsXtF/IMG-0015.jpg",

        yell:
            "https://i.ibb.co/k66gNgxL/IMG-0016.jpg",

        disappoint:
            "https://i.ibb.co/4RQGNnv3/IMG-0017.jpg"

    }

};


/* ==================================================
   VOICE FILES
================================================== */

const voiceSounds = {

    susie:
        "sounds/susie.ogg",

    ralsei:
        "sounds/ralsei.ogg"

};


/* ==================================================
   AUDIO
================================================== */

const voiceAudio = {

    susie:
        new Audio(
            voiceSounds.susie
        ),

    ralsei:
        new Audio(
            voiceSounds.ralsei
        )

};


voiceAudio.susie.preload =
    "auto";

voiceAudio.ralsei.preload =
    "auto";


voiceAudio.susie.volume =
    1;

voiceAudio.ralsei.volume =
    1;


/* ==================================================
   PROJECT
================================================== */

const savedProject =
    localStorage.getItem(
        "deltaruneDialogueProject"
    );


if (!savedProject) {

    document.body.innerHTML = `

        <div style="
            color:white;
            font-family:Arial;
            text-align:center;
            padding:40px;
        ">

            No dialogue project found.

        </div>

    `;

    throw new Error(
        "No dialogue project"
    );

}


const project =
    JSON.parse(
        savedProject
    );


const sequence =
    project.sequence || [];


/* ==================================================
   STATE
================================================== */

let currentIndex = 0;

let currentCharacter =
    "susie";

let currentFullText =
    "";

let textPosition =
    0;

let typing =
    false;

let typingTimer =
    null;


/* ==================================================
   ELEMENTS
================================================== */

const dialogue =
    document.getElementById(
        "dialogue"
    );

const character =
    document.getElementById(
        "character"
    );

const text =
    document.getElementById(
        "text"
    );

const indicator =
    document.getElementById(
        "continueIndicator"
    );

const eventScreen =
    document.getElementById(
        "eventScreen"
    );

const eventText =
    document.getElementById(
        "eventText"
    );


/* ==================================================
   PLAY VOICE
================================================== */

function playVoice(name) {

    const audio =
        voiceAudio[name];

    if (!audio) {
        return;
    }


    audio.pause();

    audio.currentTime = 0;


    audio.playbackRate =
        0.95 +
        Math.random() * 0.1;


    audio.play()
        .catch(
            error => {

                console.log(
                    "Audio could not play:",
                    error
                );

            }
        );

}


/* ==================================================
   PLAY CURRENT
================================================== */

function playCurrent() {

    if (
        currentIndex >=
        sequence.length
    ) {

        finish();

        return;

    }


    const entry =
        sequence[currentIndex];


    if (
        entry.type ===
        "dialogue"
    ) {

        playDialogue(
            entry
        );

    }

    else if (
        entry.type ===
        "event"
    ) {

        playEvent(
            entry
        );

    }

}


/* ==================================================
   DIALOGUE
================================================== */

function playDialogue(entry) {

    eventScreen.style.display =
        "none";


    dialogue.style.display =
        "block";


    currentCharacter =
        entry.character ||
        "susie";


    const sprites =
        characters[
            currentCharacter
        ];


    if (sprites) {

        character.src =
            sprites[
                entry.sprite
            ] ||
            Object.values(
                sprites
            )[0];

    }


    currentFullText =
        entry.text || "";


    textPosition =
        0;


    text.textContent =
        "";


    typing =
        true;


    indicator.style.display =
        "none";


    typeNextCharacter();

}


/* ==================================================
   TYPE LETTER
================================================== */

function typeNextCharacter() {

    if (
        textPosition >=
        currentFullText.length
    ) {

        typing =
            false;


        indicator.style.display =
            "block";


        return;

    }


    const char =
        currentFullText[
            textPosition
        ];


    text.textContent +=
        char;


    textPosition++;


    /*
       Don't play voice on:
       spaces
       punctuation
       line breaks
    */

    if (
        char !== " " &&
        char !== "\n" &&
        !/[.,!?;:'"()\[\]{}]/.test(
            char
        )
    ) {

        playVoice(
            currentCharacter
        );

    }


    typingTimer =
        setTimeout(
            typeNextCharacter,
            55
        );

}


/* ==================================================
   ADVANCE
================================================== */

function advance() {


    /*
       If text is still typing,
       finish the line immediately.
    */

    if (typing) {

        clearTimeout(
            typingTimer
        );


        text.textContent =
            currentFullText;


        textPosition =
            currentFullText.length;


        typing =
            false;


        indicator.style.display =
            "block";


        return;

    }


    indicator.style.display =
        "none";


    currentIndex++;


    playCurrent();

}


/* ==================================================
   EVENTS
================================================== */

function playEvent(entry) {

    dialogue.style.display =
        "none";


    eventScreen.style.display =
        "flex";


    eventText.textContent =
        entry.text || "";


    const duration =
        Number(
            entry.duration || 1000
        );


    if (
        entry.eventType ===
        "shake"
    ) {

        shakeEvent(
            duration
        );

    }

    else if (
        entry.eventType ===
        "laugh"
    ) {

        laughEvent(
            duration
        );

    }

    else {

        setTimeout(
            finishEvent,
            duration
        );

    }

}


/* ==================================================
   SHAKE
================================================== */

function shakeEvent(duration) {

    const start =
        Date.now();


    function loop() {

        const elapsed =
            Date.now() -
            start;


        if (
            elapsed >=
            duration
        ) {

            document.body.style.transform =
                "";

            finishEvent();

            return;

        }


        const x =
            (Math.random() - 0.5) * 12;

        const y =
            (Math.random() - 0.5) * 12;


        document.body.style.transform =
            `translate(${x}px,${y}px)`;


        requestAnimationFrame(
            loop
        );

    }


    loop();

}


/* ==================================================
   LAUGH
================================================== */

function laughEvent(duration) {

    const start =
        Date.now();


    function loop() {

        const elapsed =
            Date.now() -
            start;


        if (
            elapsed >=
            duration
        ) {

            document.body.style.transform =
                "";

            finishEvent();

            return;

        }


        const x =
            Math.sin(
                elapsed / 40
            ) * 5;


        document.body.style.transform =
            `translateX(${x}px)`;


        requestAnimationFrame(
            loop
        );

    }


    loop();

}


/* ==================================================
   FINISH EVENT
================================================== */

function finishEvent() {

    document.body.style.transform =
        "";

    eventScreen.style.display =
        "none";

    currentIndex++;

    playCurrent();

}


/* ==================================================
   FINISH
================================================== */

function finish() {

    dialogue.style.display =
        "none";

    eventScreen.style.display =
        "none";


    Object.values(
        voiceAudio
    ).forEach(
        audio => {

            audio.pause();

            audio.currentTime =
                0;

        }
    );

}


/* ==================================================
   ENTER
================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            advance();

        }

    }
);


/* ==================================================
   MOBILE
================================================== */

document.addEventListener(
    "pointerdown",
    function() {

        /*
           Mobile browsers allow audio
           after this user interaction.
        */

        advance();

    }
);


/* ==================================================
   START
================================================== */

playCurrent();

</script>

</body>

</html>
