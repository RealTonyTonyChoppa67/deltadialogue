<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Dialogue Player</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    background: black;

    overflow: hidden;

    color: white;

    user-select: none;
    -webkit-user-select: none;

    font-family:
        "Courier New",
        monospace;

}

body {

    display: flex;

    justify-content: center;

    align-items: flex-end;

}


/* =========================
   GAME SCREEN
========================= */

#game {

    position: relative;

    width: 100%;
    height: 100%;

    background: black;

    display: flex;

    justify-content: center;

    align-items: flex-end;

}


/* =========================
   DIALOGUE
========================= */

.dialogue {

    position: relative;

    width: min(
        100vw,
        1100px
    );

    margin-bottom: 15px;

    display: none;

}


/* Keep original dialogue-box
   proportions */

.dialogue-background {

    width: 100%;

    height: auto;

    display: block;

}


/* =========================
   CHARACTER
========================= */

.character {

    position: absolute;

    left: 5%;

    bottom: 8%;

    width: 20%;

    height: 72%;

    object-fit: contain;

    object-position: bottom center;

    image-rendering: pixelated;

}


/* =========================
   TEXT
========================= */

.text {

    position: absolute;

    left: 29%;

    right: 6%;

    top: 25%;

    bottom: 18%;

    color: white;

    font-family:
        "8-bit Operator JVE",
        "Courier New",
        monospace;

    font-size:
        clamp(
            14px,
            2.4vw,
            28px
        );

    line-height: 1.35;

    white-space: pre-wrap;

    overflow: hidden;

}


/* =========================
   CONTINUE INDICATOR
========================= */

#continueIndicator {

    position: absolute;

    right: 3%;

    bottom: 9%;

    font-size: 18px;

    animation:
        blink 0.8s infinite;

    display: none;

}

@keyframes blink {

    50% {
        opacity: 0.2;
    }

}


/* =========================
   EVENTS
========================= */

#eventScreen {

    position: absolute;

    inset: 0;

    display: none;

    justify-content: center;

    align-items: center;

    background: black;

    z-index: 20;

}


.event-text {

    font-family:
        "8-bit Operator JVE",
        "Courier New",
        monospace;

    font-size:
        clamp(
            18px,
            4vw,
            40px
        );

    text-align: center;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .dialogue {

        width: 100%;

        margin-bottom: 5px;

    }

    .text {

        font-size:
            clamp(
                10px,
                3.2vw,
                18px
            );

    }

    .character {

        width: 21%;

    }

}

</style>

</head>


<body>


<div id="game">


    <!-- =====================
         DIALOGUE BOX
    ====================== -->

    <div
        id="dialogue"
        class="dialogue"
    >

        <img
            class="dialogue-background"
            src="https://i.ibb.co/21Z5G7Yn/Untitled7-20260815081350.png"
            alt="Dialogue box"
        >


        <img
            id="character"
            class="character"
            src=""
            alt="Character"
        >


        <div
            id="text"
            class="text"
        ></div>


        <div
            id="continueIndicator"
        >
            ▼
        </div>

    </div>


    <!-- =====================
         EVENTS
    ====================== -->

    <div
        id="eventScreen"
    >

        <div
            id="eventText"
            class="event-text"
        ></div>

    </div>

</div>


<script>


/* ==================================================
   CHARACTER SPRITES
================================================== */

const characters = {

    susie: {

        neutral:
            "https://i.ibb.co/G4nYggzv/IMG-0004.jpg",

        mad:
            "https://i.ibb.co/gFHhswgR/IMG-0005.jpg",

        evil_1:
            "https://i.ibb.co/tPcV6xPn/IMG-0006.jpg",

        evil_2:
            "https://i.ibb.co/wZrZJrDd/IMG-0007.jpg",

        evil_3:
            "https://i.ibb.co/bRrjQF5B/IMG-0008.jpg",

        goofyMad:
            "https://i.ibb.co/Jj3mHthd/IMG-0009.jpg",

        awkward:
            "https://i.ibb.co/Cp225DcB/IMG-0010.jpg",

        madEvil:
            "https://i.ibb.co/5gYCTqtx/IMG-0012.jpg"

    },


    ralsei: {

        happy:
            "https://i.ibb.co/G3fVqRj7/IMG-0014.jpg",

        happyBlush:
            "https://i.ibb.co/5xxjf0kk/IMG-0013.jpg",

        shockWorried:
            "https://i.ibb.co/gMxqsXtF/IMG-0015.jpg",

        yell:
            "https://i.ibb.co/k66gNgxL/IMG-0016.jpg",

        disappoint:
            "https://i.ibb.co/4RQGNnv3/IMG-0017.jpg"

    }

};


/* ==================================================
   CHARACTER VOICE AUDIO
==================================================

   Change these paths if your files have
   different names or folders.
================================================== */

const voiceSounds = {

    susie:
        "sounds/susie.ogg",

    ralsei:
        "sounds/ralsei.ogg"

};


/* ==================================================
   AUDIO OBJECTS
================================================== */

const voiceAudio = {

    susie:
        new Audio(voiceSounds.susie),

    ralsei:
        new Audio(voiceSounds.ralsei)

};


/* ==================================================
   PROJECT
================================================== */

const savedProject =
    localStorage.getItem(
        "deltaruneDialogueProject"
    );


if (!savedProject) {

    document.body.innerHTML = `

        <div style="
            color:white;
            font-family:Arial;
            text-align:center;
            padding:40px;
        ">

            No dialogue project found.

        </div>

    `;

    throw new Error(
        "No dialogue project"
    );

}


const project =
    JSON.parse(
        savedProject
    );


const sequence =
    project.sequence || [];


/* ==================================================
   PLAYER STATE
================================================== */

let currentIndex = 0;

let currentCharacter =
    "susie";

let typing = false;

let typingTimer = null;

let currentFullText = "";

let textPosition = 0;


/* ==================================================
   ELEMENTS
================================================== */

const dialogue =
    document.getElementById(
        "dialogue"
    );


const character =
    document.getElementById(
        "character"
    );


const text =
    document.getElementById(
        "text"
    );


const indicator =
    document.getElementById(
        "continueIndicator"
    );


const eventScreen =
    document.getElementById(
        "eventScreen"
    );


const eventText =
    document.getElementById(
        "eventText"
    );


/* ==================================================
   AUDIO UNLOCK
==================================================

   Mobile browsers can block audio until
   the user interacts with the page.

   We silently initialize the sounds after
   the first tap/key press.
================================================== */

let audioUnlocked = false;


function unlockAudio() {

    if (audioUnlocked) {
        return;
    }

    audioUnlocked = true;


    Object.values(
        voiceAudio
    ).forEach(
        audio => {

            audio.volume = 0;

            audio.play()
                .then(
                    () => {

                        audio.pause();

                        audio.currentTime =
                            0;

                        audio.volume =
                            1;

                    }
                )
                .catch(
                    () => {

                        audio.volume =
                            1;

                    }
                );

        }
    );

}


/* ==================================================
   PLAY CURRENT ENTRY
================================================== */

function playCurrent() {

    if (
        currentIndex >=
        sequence.length
    ) {

        finish();

        return;

    }


    const entry =
        sequence[currentIndex];


    if (
        entry.type ===
        "dialogue"
    ) {

        playDialogue(
            entry
        );

    }

    else if (
        entry.type ===
        "event"
    ) {

        playEvent(
            entry
        );

    }

}


/* ==================================================
   PLAY DIALOGUE
================================================== */

function playDialogue(entry) {

    eventScreen.style.display =
        "none";


    dialogue.style.display =
        "block";


    currentCharacter =
        entry.character ||
        "susie";


    const characterSprites =
        characters[
            currentCharacter
        ];


    character.src =
        characterSprites[
            entry.sprite
        ] ||
        characterSprites[
            Object.keys(
                characterSprites
            )[0]
        ];


    currentFullText =
        entry.text || "";


    textPosition =
        0;


    text.textContent =
        "";


    typing =
        true;


    indicator.style.display =
        "none";


    typeNextCharacter();

}


/* ==================================================
   TYPE TEXT
================================================== */

function typeNextCharacter() {

    if (
        textPosition >=
        currentFullText.length
    ) {

        typing =
            false;


        indicator.style.display =
            "block";


        return;

    }


    const currentChar =
        currentFullText[
            textPosition
        ];


    text.textContent +=
        currentChar;


    textPosition++;


    /*
       Play voice audio for actual
       letters/numbers.

       Spaces and punctuation are
       silent.
    */

    if (
        currentChar !== " " &&
        currentChar !== "\n" &&
        !/[.,!?;:'"()\[\]{}]/.test(
            currentChar
        )
    ) {

        playVoice(
            currentCharacter
        );

    }


    /*
       Change this number to adjust
       typing speed.

       35 = fairly fast
       50 = slower
       20 = very fast
    */

    typingTimer =
        setTimeout(
            typeNextCharacter,
            35
        );

}


/* ==================================================
   PLAY CHARACTER VOICE
================================================== */

function playVoice(characterName) {

    const audio =
        voiceAudio[
            characterName
        ];


    if (!audio) {
        return;
    }


    /*
       Restart the sound every letter.
    */

    audio.pause();

    audio.currentTime =
        0;


    /*
       Tiny pitch variation so
       every letter doesn't sound
       completely identical.
    */

    audio.playbackRate =
        0.95 +
        Math.random() * 0.10;


    audio.volume =
        1;


    audio.play()
        .catch(
            () => {}
        );

}


/* ==================================================
   ADVANCE
================================================== */

function advance() {

    unlockAudio();


    /*
       If text is still typing,
       immediately finish it.
    */

    if (typing) {

        clearTimeout(
            typingTimer
        );


        text.textContent =
            currentFullText;


        textPosition =
            currentFullText.length;


        typing =
            false;


        indicator.style.display =
            "block";


        return;

    }


    indicator.style.display =
        "none";


    currentIndex++;


    playCurrent();

}


/* ==================================================
   EVENTS
================================================== */

function playEvent(entry) {

    dialogue.style.display =
        "none";


    eventScreen.style.display =
        "flex";


    eventText.textContent =
        entry.text || "";


    const duration =
        Number(
            entry.duration ||
            1000
        );


    if (
        entry.eventType ===
        "laugh"
    ) {

        playLaugh(
            duration
        );

    }


    else if (
        entry.eventType ===
        "shake"
    ) {

        playShake(
            duration
        );

    }


    else {

        setTimeout(
            finishEvent,
            duration
        );

    }

}


/* ==================================================
   LAUGH EVENT
================================================== */

function playLaugh(duration) {

    const start =
        Date.now();


    function animate() {

        const elapsed =
            Date.now() -
            start;


        if (
            elapsed >=
            duration
        ) {

            document.body.style.transform =
                "";

            finishEvent();

            return;

        }


        const offset =
            Math.sin(
                elapsed / 45
            ) * 5;


        document.body.style.transform =
            `translateX(${offset}px)`;


        requestAnimationFrame(
            animate
        );

    }


    animate();

}


/* ==================================================
   SHAKE EVENT
================================================== */

function playShake(duration) {

    const start =
        Date.now();


    function shake() {

        const elapsed =
            Date.now() -
            start;


        if (
            elapsed >=
            duration
        ) {

            document.body.style.transform =
                "";

            finishEvent();

            return;

        }


        const x =
            (Math.random() - 0.5) *
            14;


        const y =
            (Math.random() - 0.5) *
            14;


        document.body.style.transform =
            `translate(${x}px, ${y}px)`;


        requestAnimationFrame(
            shake
        );

    }


    shake();

}


/* ==================================================
   FINISH EVENT
================================================== */

function finishEvent() {

    document.body.style.transform =
        "";


    eventScreen.style.display =
        "none";


    currentIndex++;


    playCurrent();

}


/* ==================================================
   FINISH PROJECT
================================================== */

function finish() {

    dialogue.style.display =
        "none";


    eventScreen.style.display =
        "none";


    /*
       Stop any currently playing
       character sound.
    */

    Object.values(
        voiceAudio
    ).forEach(
        audio => {

            audio.pause();

            audio.currentTime =
                0;

        }
    );

}


/* ==================================================
   KEYBOARD
================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        unlockAudio();


        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            advance();

        }

    }
);


/* ==================================================
   MOBILE / TOUCH
================================================== */

document.addEventListener(
    "pointerdown",
    function(event) {

        unlockAudio();


        /*
           Don't advance while an
           event is running.
        */

        if (
            eventScreen.style.display ===
            "flex"
        ) {

            return;

        }


        advance();

    }
);


/* ==================================================
   START
================================================== */

playCurrent();

</script>

</body>
</html>
