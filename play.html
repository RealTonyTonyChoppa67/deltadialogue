<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Dialogue Player</title>

<style>

/* =========================================
   GENERAL
========================================= */

* {
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;

    background: black;

    overflow: hidden;

    color: white;

    user-select: none;
    -webkit-user-select: none;

}

body {

    display: flex;

    justify-content: center;

    align-items: flex-end;

}


/* =========================================
   GAME
========================================= */

#game {

    position: relative;

    width: 100%;
    height: 100%;

    background: black;

    display: flex;

    justify-content: center;

    align-items: flex-end;

}


/* =========================================
   DIALOGUE BOX
========================================= */

.dialogue {

    position: relative;

    width: min(
        100vw,
        1100px
    );

    margin-bottom: 12px;

    display: none;

}


.dialogue-background {

    width: 100%;

    height: auto;

    display: block;

}


/* =========================================
   CHARACTER
========================================= */

.character {

    position: absolute;

    left: 5%;

    bottom: 8%;

    width: 20%;

    height: 72%;

    object-fit: contain;

    object-position: bottom center;

    image-rendering: pixelated;

}


/* =========================================
   TEXT
========================================= */

.text {

    position: absolute;

    left: 29%;

    right: 6%;

    top: 25%;

    bottom: 18%;

    color: white;

    font-family:
        "8-bit Operator JVE",
        "Courier New",
        monospace;

    font-size:
        clamp(
            14px,
            2.4vw,
            28px
        );

    line-height: 1.35;

    white-space: pre-wrap;

    overflow: hidden;

}


/* =========================================
   CONTINUE INDICATOR
========================================= */

#continueIndicator {

    position: absolute;

    right: 3%;

    bottom: 8%;

    font-size: 18px;

    display: none;

    animation:
        blink 0.8s infinite;

}

@keyframes blink {

    50% {
        opacity: 0.2;
    }

}


/* =========================================
   EVENT SCREEN
========================================= */

#eventScreen {

    position: absolute;

    inset: 0;

    background: black;

    display: none;

    justify-content: center;

    align-items: center;

    z-index: 50;

}


.event-text {

    font-family:
        "8-bit Operator JVE",
        "Courier New",
        monospace;

    font-size:
        clamp(
            18px,
            4vw,
            40px
        );

    text-align: center;

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .dialogue {

        width: 100%;

        margin-bottom: 5px;

    }

    .text {

        font-size:
            clamp(
                10px,
                3.2vw,
                18px
            );

    }

    .character {

        width: 21%;

    }

}

</style>

</head>


<body>


<div id="game">


    <!-- =====================================
         DIALOGUE
    ====================================== -->

    <div
        id="dialogue"
        class="dialogue"
    >

        <img
            class="dialogue-background"
            src="https://i.ibb.co/21Z5G7Yn/Untitled7-20260815081350.png"
            alt="Dialogue box"
        >


        <img
            id="character"
            class="character"
            src=""
            alt="Character"
        >


        <div
            id="text"
            class="text"
        ></div>


        <div
            id="continueIndicator"
        >
            ▼
        </div>

    </div>


    <!-- =====================================
         EVENTS
    ====================================== -->

    <div
        id="eventScreen"
    >

        <div
            id="eventText"
            class="event-text"
        ></div>

    </div>

</div>


<script>


/* ==================================================
   CHARACTER SPRITES
================================================== */

const characters = {

    susie: {

        neutral:
            "https://i.ibb.co/G4nYggzv/IMG-0004.jpg",

        mad:
            "https://i.ibb.co/gFHhswgR/IMG-0005.jpg",

        evil_1:
            "https://i.ibb.co/tPcV6xPn/IMG-0006.jpg",

        evil_2:
            "https://i.ibb.co/wZrZJrDd/IMG-0007.jpg",

        evil_3:
            "https://i.ibb.co/bRrjQF5B/IMG-0008.jpg",

        goofyMad:
            "https://i.ibb.co/Jj3mHthd/IMG-0009.jpg",

        awkward:
            "https://i.ibb.co/Cp225DcB/IMG-0010.jpg",

        madEvil:
            "https://i.ibb.co/5gYCTqtx/IMG-0012.jpg"

    },


    ralsei: {

        happy:
            "https://i.ibb.co/G3fVqRj7/IMG-0014.jpg",

        happyBlush:
            "https://i.ibb.co/5xxjf0kk/IMG-0013.jpg",

        shockWorried:
            "https://i.ibb.co/gMxqsXtF/IMG-0015.jpg",

        yell:
            "https://i.ibb.co/k66gNgxL/IMG-0016.jpg",

        disappoint:
            "https://i.ibb.co/4RQGNnv3/IMG-0017.jpg"

    }

};


/* ==================================================
   VOICE FILES
==================================================

   These are relative paths.

   Your repository should contain:

   sounds/
       susie.ogg
       ralsei.ogg

================================================== */

const voiceFiles = {

    susie:
        "susie.ogg",

    ralsei:
        "ralsei.ogg"

};


/* ==================================================
   VOICE AUDIO POOLS
==================================================

   Four audio objects per character.

   This prevents the audio from constantly
   restarting the exact same audio object.

================================================== */

const voicePools = {

    susie: [],

    ralsei: []

};


const voicePoolPosition = {

    susie: 0,

    ralsei: 0

};


const VOICE_VOLUME =
    0.25;


for (
    let i = 0;
    i < 4;
    i++
) {


    const susieAudio =
        new Audio(
            voiceFiles.susie
        );


    susieAudio.preload =
        "auto";


    susieAudio.volume =
        VOICE_VOLUME;


    voicePools.susie.push(
        susieAudio
    );


    const ralseiAudio =
        new Audio(
            voiceFiles.ralsei
        );


    ralseiAudio.preload =
        "auto";


    ralseiAudio.volume =
        VOICE_VOLUME;


    voicePools.ralsei.push(
        ralseiAudio
    );

}


/* ==================================================
   PLAY VOICE
================================================== */

function playVoice(
    characterName
) {

    const pool =
        voicePools[
            characterName
        ];


    if (
        !pool ||
        pool.length === 0
    ) {

        return;

    }


    const position =
        voicePoolPosition[
            characterName
        ];


    const audio =
        pool[position];


    voicePoolPosition[
        characterName
    ] =
        (
            position + 1
        ) %
        pool.length;


    audio.pause();

    audio.currentTime =
        0;


    /*
       Tiny random pitch variation.
    */

    audio.playbackRate =
        0.95 +
        Math.random() * 0.10;


    audio.volume =
        VOICE_VOLUME;


    audio.play()
        .catch(
            () => {}
        );

}


/* ==================================================
   STOP ALL VOICES
================================================== */

function stopAllVoices() {

    Object.values(
        voicePools
    ).forEach(
        pool => {

            pool.forEach(
                audio => {

                    audio.pause();

                    audio.currentTime =
                        0;

                }

            );

        }

    );

}


/* ==================================================
   PROJECT DATA
================================================== */

const savedProject =
    localStorage.getItem(
        "deltaruneDialogueProject"
    );


if (!savedProject) {

    document.body.innerHTML = `

        <div style="
            color:white;
            font-family:Arial;
            text-align:center;
            padding:40px;
        ">

            No dialogue project found.

        </div>

    `;


    throw new Error(
        "No dialogue project found"
    );

}


let project;


try {

    project =
        JSON.parse(
            savedProject
        );

}

catch {

    document.body.innerHTML = `

        <div style="
            color:white;
            font-family:Arial;
            text-align:center;
            padding:40px;
        ">

            The dialogue project is invalid.

        </div>

    `;


    throw new Error(
        "Invalid dialogue project"
    );

}


const sequence =
    project.sequence || [];


/* ==================================================
   STATE
================================================== */

let currentIndex =
    0;


let currentCharacter =
    "susie";


let currentFullText =
    "";


let textPosition =
    0;


let typing =
    false;


let typingTimer =
    null;


let eventRunning =
    false;


/* ==================================================
   ELEMENTS
================================================== */

const dialogue =
    document.getElementById(
        "dialogue"
    );


const character =
    document.getElementById(
        "character"
    );


const text =
    document.getElementById(
        "text"
    );


const indicator =
    document.getElementById(
        "continueIndicator"
    );


const eventScreen =
    document.getElementById(
        "eventScreen"
    );


const eventText =
    document.getElementById(
        "eventText"
    );


/* ==================================================
   PLAY CURRENT ENTRY
================================================== */

function playCurrent() {

    if (
        currentIndex >=
        sequence.length
    ) {

        finish();

        return;

    }


    const entry =
        sequence[
            currentIndex
        ];


    if (
        entry.type ===
        "dialogue"
    ) {

        playDialogue(
            entry
        );

        return;

    }


    if (
        entry.type ===
        "event"
    ) {

        playEvent(
            entry
        );

        return;

    }


    /*
       Unknown entry type.
       Skip it rather than getting stuck.
    */

    currentIndex++;

    playCurrent();

}


/* ==================================================
   PLAY DIALOGUE
================================================== */

function playDialogue(
    entry
) {

    eventRunning =
        false;


    eventScreen.style.display =
        "none";


    dialogue.style.display =
        "block";


    currentCharacter =
        entry.character ||
        "susie";


    const spriteSet =
        characters[
            currentCharacter
        ];


    if (spriteSet) {

        character.src =
            spriteSet[
                entry.sprite
            ] ||
            Object.values(
                spriteSet
            )[0];

    }


    currentFullText =
        entry.text || "";


    textPosition =
        0;


    text.textContent =
        "";


    typing =
        true;


    indicator.style.display =
        "none";


    clearTimeout(
        typingTimer
    );


    typeNextCharacter();

}


/* ==================================================
   TYPE NEXT CHARACTER
================================================== */

function typeNextCharacter() {

    if (
        textPosition >=
        currentFullText.length
    ) {

        finishTyping();

        return;

    }


    const currentChar =
        currentFullText[
            textPosition
        ];


    text.textContent +=
        currentChar;


    textPosition++;


    /*
       Play voice for letters
       and numbers.

       Spaces and punctuation
       remain silent.
    */

    if (
        currentChar !== " " &&
        currentChar !== "\n" &&
        !/[.,!?;:'"()\[\]{}]/.test(
            currentChar
        )
    ) {

        playVoice(
            currentCharacter
        );

    }


    /*
       65ms typing speed.

       Your sounds are 100ms long,
       so they overlap slightly,
       which gives the chunky voice effect.
    */

    typingTimer =
        setTimeout(
            typeNextCharacter,
            65
        );

}


/* ==================================================
   FINISH TYPING
================================================== */

function finishTyping() {

    clearTimeout(
        typingTimer
    );


    typing =
        false;


    text.textContent =
        currentFullText;


    textPosition =
        currentFullText.length;


    indicator.style.display =
        "block";


    /*
       Stop any leftover voice
       clips after the text is done.
    */

    stopAllVoices();

}


/* ==================================================
   ADVANCE
================================================== */

function advance() {

    /*
       Never advance while an
       event is running.
    */

    if (eventRunning) {

        return;

    }


    /*
       If the text is still typing,
       instantly finish it.
    */

    if (typing) {

        clearTimeout(
            typingTimer
        );


        text.textContent =
            currentFullText;


        textPosition =
            currentFullText.length;


        typing =
            false;


        indicator.style.display =
            "block";


        stopAllVoices();


        return;

    }


    indicator.style.display =
        "none";


    stopAllVoices();


    currentIndex++;


    playCurrent();

}


/* ==================================================
   EVENTS
================================================== */

function playEvent(
    entry
) {

    eventRunning =
        true;


    dialogue.style.display =
        "none";


    eventScreen.style.display =
        "flex";


    eventText.textContent =
        entry.text || "";


    const duration =
        Number(
            entry.duration ||
            1000
        );


    if (
        entry.eventType ===
        "shake"
    ) {

        shakeEvent(
            duration
        );

        return;

    }


    if (
        entry.eventType ===
        "laugh"
    ) {

        laughEvent(
            duration
        );

        return;

    }


    setTimeout(
        finishEvent,
        duration
    );

}


/* ==================================================
   SHAKE EVENT
================================================== */

function shakeEvent(
    duration
) {

    const start =
        Date.now();


    function animate() {

        const elapsed =
            Date.now() -
            start;


        if (
            elapsed >=
            duration
        ) {

            document.body.style.transform =
                "";


            finishEvent();


            return;

        }


        const x =
            (
                Math.random() -
                0.5
            ) * 14;


        const y =
            (
                Math.random() -
                0.5
            ) * 14;


        document.body.style.transform =
            `translate(${x}px, ${y}px)`;


        requestAnimationFrame(
            animate
        );

    }


    animate();

}


/* ==================================================
   LAUGH EVENT
================================================== */

function laughEvent(
    duration
) {

    const start =
        Date.now();


    function animate() {

        const elapsed =
            Date.now() -
            start;


        if (
            elapsed >=
            duration
        ) {

            document.body.style.transform =
                "";


            finishEvent();


            return;

        }


        const x =
            Math.sin(
                elapsed / 40
            ) * 5;


        document.body.style.transform =
            `translateX(${x}px)`;


        requestAnimationFrame(
            animate
        );

    }


    animate();

}


/* ==================================================
   FINISH EVENT
================================================== */

function finishEvent() {

    document.body.style.transform =
        "";


    eventScreen.style.display =
        "none";


    eventRunning =
        false;


    currentIndex++;


    playCurrent();

}


/* ==================================================
   FINISH PROJECT
================================================== */

function finish() {

    clearTimeout(
        typingTimer
    );


    typing =
        false;


    eventRunning =
        false;


    stopAllVoices();


    dialogue.style.display =
        "none";


    eventScreen.style.display =
        "none";

}


/* ==================================================
   KEYBOARD
================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key !==
            "Enter"
        ) {

            return;

        }


        event.preventDefault();


        advance();

    }
);


/* ==================================================
   MOBILE TOUCH
================================================== */

document.addEventListener(
    "pointerdown",
    function(event) {

        /*
           Don't let buttons or other
           interface elements accidentally
           advance the dialogue.
        */

        if (
            event.target.closest(
                "button"
            )
        ) {

            return;

        }


        advance();

    }
);


/* ==================================================
   START
================================================== */

if (
    sequence.length > 0
) {

    playCurrent();

}

else {

    finish();

}

</script>

</body>

</html>
