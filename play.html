<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
>

<title>Deltarune Dialogue</title>

<style>

@font-face {

    font-family: "8-bit Operator JVE";

    src: url("8bitoperator_jve.ttf") format("truetype");

    font-weight: normal;
    font-style: normal;

}


* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    color: white;

    font-family:
        "8-bit Operator JVE",
        monospace;

}


body {

    display: flex;

    justify-content: center;

    align-items: center;

    touch-action: manipulation;

}


/* ==========================================
   GAME
========================================== */

#game {

    position: relative;

    width: 100vw;
    height: 100vh;

    max-width: 1600px;

    overflow: hidden;

    background: #000;

}


/* ==========================================
   DIALOGUE BOX
========================================== */

#dialogueBox {

    position: absolute;

    left: 50%;

    bottom: 2.5%;

    transform: translateX(-50%);

    width: 92%;

    z-index: 10;

}


#dialogueBackground {

    display: block;

    width: 100%;

    height: auto;

}


#character {

    position: absolute;

    left: 5%;

    bottom: 7%;

    width: 20%;

    height: 75%;

    object-fit: contain;

    object-position: bottom center;

    image-rendering: pixelated;

}


#dialogueText {

    position: absolute;

    left: 29%;

    right: 6%;

    top: 24%;

    bottom: 17%;

    color: white;

    font-family:
        "8-bit Operator JVE",
        monospace;

    font-size:
        clamp(
            15px,
            2.4vw,
            32px
        );

    line-height: 1.35;

    white-space: pre-wrap;

    overflow-wrap: break-word;

    overflow: hidden;

}


/* ==========================================
   TAP INDICATOR
========================================== */

#continueIndicator {

    position: absolute;

    right: 3%;

    bottom: 7%;

    font-size: 20px;

    animation:
        blink 0.8s infinite;

    display: none;

}


@keyframes blink {

    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: 0;
    }

}


/* ==========================================
   EVENT OVERLAY
========================================== */

#eventOverlay {

    position: absolute;

    inset: 0;

    z-index: 20;

    display: none;

    justify-content: center;

    align-items: center;

    background: #000;

}


#eventText {

    font-family:
        "8-bit Operator JVE",
        monospace;

    font-size:
        clamp(
            18px,
            4vw,
            40px
        );

    text-align: center;

}


/* ==========================================
   START SCREEN
========================================== */

#startScreen {

    position: absolute;

    inset: 0;

    z-index: 50;

    background: #000;

    display: flex;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    font-family:
        "8-bit Operator JVE",
        monospace;

}


#startScreen button {

    margin-top: 20px;

    padding: 14px 25px;

    border: 2px solid white;

    background: black;

    color: white;

    font-family:
        "8-bit Operator JVE",
        monospace;

    font-size: 18px;

    cursor: pointer;

}


#startScreen button:hover {

    background: white;

    color: black;

}


/* ==========================================
   ERROR
========================================== */

#errorScreen {

    position: absolute;

    inset: 0;

    z-index: 100;

    background: #000;

    display: none;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    padding: 25px;

    text-align: center;

}


#errorScreen button {

    margin-top: 20px;

    padding: 12px 20px;

    background: white;

    color: black;

    border: 0;

    font-family:
        "8-bit Operator JVE",
        monospace;

}


/* ==========================================
   MOBILE
========================================== */

@media (max-width: 700px) {

    #dialogueBox {

        width: 96%;

        bottom: 2%;

    }


    #character {

        left: 4%;

        width: 22%;

        height: 72%;

    }


    #dialogueText {

        left: 29%;

        right: 5%;

        top: 24%;

        bottom: 17%;

        font-size:
            clamp(
                10px,
                3.3vw,
                20px
            );

    }

}

</style>

</head>


<body>


<div id="game">


    <!-- ==================================
         DIALOGUE
    =================================== -->

    <div id="dialogueBox">

        <img
            id="dialogueBackground"
            src="https://i.ibb.co/21Z5G7Yn/Untitled7-20260815081350.png"
            alt=""
        >

        <img
            id="character"
            src=""
            alt=""
        >

        <div id="dialogueText"></div>

        <div id="continueIndicator">
            ▼
        </div>

    </div>


    <!-- ==================================
         EVENTS
    =================================== -->

    <div id="eventOverlay">

        <div id="eventText"></div>

    </div>


    <!-- ==================================
         START SCREEN
    =================================== -->

    <div id="startScreen">

        <div>
            DIALOGUE
        </div>

        <button id="startButton">
            TAP TO START
        </button>

    </div>


    <!-- ==================================
         ERROR SCREEN
    =================================== -->

    <div id="errorScreen">

        <div id="errorMessage">
            No dialogue project was found.
        </div>

        <button
            onclick="location.href='index.html'"
        >
            BACK TO GENERATOR
        </button>

    </div>

</div>


<script>


/* ==========================================
   CHARACTER DATA
========================================== */

const characters = {

    susie: {

        name: "Susie",

        voice:
            "susie.ogg",

        sprites: {

            neutral:
                "https://i.ibb.co/G4nYggzv/IMG-0004.jpg",

            mad:
                "https://i.ibb.co/gFHhswgR/IMG-0005.jpg",

            evil_1:
                "https://i.ibb.co/tPcV6xPn/IMG-0006.jpg",

            evil_2:
                "https://i.ibb.co/wZrZJrDd/IMG-0007.jpg",

            evil_3:
                "https://i.ibb.co/bRrjQF5B/IMG-0008.jpg",

            goofyMad:
                "https://i.ibb.co/Jj3mHthd/IMG-0009.jpg",

            awkward:
                "https://i.ibb.co/Cp225DcB/IMG-0010.jpg",

            madEvil:
                "https://i.ibb.co/5gYCTqtx/IMG-0012.jpg"

        }

    },


    ralsei: {

        name: "Ralsei",

        voice:
            "ralsei.ogg",

        sprites: {

            happy:
                "https://i.ibb.co/G3fVqRj7/IMG-0014.jpg",

            happyBlush:
                "https://i.ibb.co/5xxjf0kk/IMG-0013.jpg",

            shockWorried:
                "https://i.ibb.co/gMxqsXtF/IMG-0015.jpg",

            yell:
                "https://i.ibb.co/k66gNgxL/IMG-0016.jpg",

            disappoint:
                "https://i.ibb.co/4RQGNnv3/IMG-0017.jpg"

        }

    }

};


/* ==========================================
   ELEMENTS
========================================== */

const dialogueText =
    document.getElementById(
        "dialogueText"
    );

const characterImage =
    document.getElementById(
        "character"
    );

const continueIndicator =
    document.getElementById(
        "continueIndicator"
    );

const eventOverlay =
    document.getElementById(
        "eventOverlay"
    );

const eventText =
    document.getElementById(
        "eventText"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const errorScreen =
    document.getElementById(
        "errorScreen"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );


/* ==========================================
   PROJECT
========================================== */

let sequence = [];

let currentIndex = 0;

let typing = false;

let currentText = "";

let typingPosition = 0;

let typingTimer = null;


/* ==========================================
   AUDIO
========================================== */

/*
    One reusable audio element.

    This is important because repeatedly creating
    audio objects for every letter can cause lag,
    especially on mobile.
*/

const voiceAudio =
    new Audio();

voiceAudio.preload =
    "auto";

voiceAudio.loop =
    true;

voiceAudio.volume =
    0.25;


let currentVoice =
    null;


/* ==========================================
   LOAD PROJECT
========================================== */

function loadProject() {

    const saved =
        localStorage.getItem(
            "deltaruneDialogueProject"
        );


    if (!saved) {

        showError(
            "No dialogue project was found. Generate a dialogue from index.html first."
        );

        return false;

    }


    try {

        const data =
            JSON.parse(
                saved
            );


        if (
            !data ||
            !Array.isArray(
                data.sequence
            )
        ) {

            throw new Error(
                "Invalid sequence"
            );

        }


        sequence =
            data.sequence;


        if (
            sequence.length === 0
        ) {

            showError(
                "Your project doesn't contain any dialogue."
            );

            return false;

        }


        return true;

    }

    catch (error) {

        console.error(
            "Project loading error:",
            error
        );


        showError(
            "The dialogue project could not be loaded."
        );

        return false;

    }

}


/* ==========================================
   ERROR
========================================== */

function showError(message) {

    errorMessage.textContent =
        message;

    errorScreen.style.display =
        "flex";

}


/* ==========================================
   START
========================================== */

startButton.addEventListener(
    "click",
    function() {

        startScreen.style.display =
            "none";

        startDialogue();

    }
);


/* ==========================================
   START DIALOGUE
========================================== */

function startDialogue() {

    currentIndex =
        0;

    playCurrentEntry();

}


/* ==========================================
   PLAY ENTRY
========================================== */

function playCurrentEntry() {

    clearTyping();

    stopVoice();


    if (
        currentIndex >=
        sequence.length
    ) {

        finishDialogue();

        return;

    }


    const entry =
        sequence[currentIndex];


    if (!entry) {

        advance();

        return;

    }


    if (
        entry.type ===
        "event"
    ) {

        playEvent(
            entry
        );

        return;

    }


    playDialogue(
        entry
    );

}


/* ==========================================
   PLAY DIALOGUE
========================================== */

function playDialogue(entry) {

    eventOverlay.style.display =
        "none";


    const character =
        characters[
            entry.character
        ];


    if (!character) {

        advance();

        return;

    }


    /*
       Set sprite
    */

    const sprite =
        character.sprites[
            entry.sprite
        ];


    if (sprite) {

        characterImage.src =
            sprite;

        characterImage.style.display =
            "block";

    }

    else {

        characterImage.style.display =
            "none";

    }


    /*
       Text
    */

    currentText =
        String(
            entry.text || ""
        );


    dialogueText.textContent =
        "";


    continueIndicator.style.display =
        "none";


    typing =
        true;

    typingPosition =
        0;


    /*
       Start voice before typing.

       The first dialogue therefore gets
       the same audio treatment as every
       dialogue after it.
    */

    startVoice(
        character.voice
    );


    typeNextCharacter();

}


/* ==========================================
   TYPE TEXT
========================================== */

function typeNextCharacter() {

    if (!typing) {
        return;
    }


    if (
        typingPosition >=
        currentText.length
    ) {

        finishTyping();

        return;

    }


    dialogueText.textContent +=
        currentText[
            typingPosition
        ];


    typingPosition++;


    /*
       Skip audio on spaces and line breaks.
       It sounds much closer to game dialogue.
    */

    const character =
        currentText[
            typingPosition - 1
        ];


    if (
        character !== " " &&
        character !== "\n" &&
        character !== "\r"
    ) {

        restartVoicePulse();

    }


    /*
       Small delay between letters.

       Using setTimeout rather than a giant
       pile of audio objects keeps mobile
       browsers happier.
    */

    typingTimer =
        setTimeout(
            typeNextCharacter,
            32
        );

}


/* ==========================================
   FINISH TYPING
========================================== */

function finishTyping() {

    typing =
        false;


    clearTimeout(
        typingTimer
    );


    dialogueText.textContent =
        currentText;


    continueIndicator.style.display =
        "block";

}


/* ==========================================
   CLEAR TYPING
========================================== */

function clearTyping() {

    typing =
        false;


    clearTimeout(
        typingTimer
    );


    typingTimer =
        null;

}


/* ==========================================
   SKIP TYPING
========================================== */

function skipTyping() {

    if (!typing) {
        return false;
    }


    clearTyping();


    dialogueText.textContent =
        currentText;


    continueIndicator.style.display =
        "block";


    return true;

}


/* ==========================================
   AUDIO
========================================== */

function startVoice(src) {

    if (!src) {
        return;
    }


    if (
        currentVoice ===
        src
    ) {

        return;

    }


    currentVoice =
        src;


    voiceAudio.pause();

    voiceAudio.currentTime =
        0;

    voiceAudio.src =
        src;

    voiceAudio.load();


    /*
       play() may be blocked until the
       user interacts with the page.

       The Start button provides that
       interaction on mobile.
    */

    const promise =
        voiceAudio.play();


    if (
        promise &&
        promise.catch
    ) {

        promise.catch(
            error => {

                console.log(
                    "Voice playback waiting for interaction:",
                    error
                );

            }
        );

    }

}


/*
    Instead of creating a new audio object
    for every character, briefly restart
    the SAME audio element.

    This prevents hundreds of simultaneous
    audio objects from building up.
*/

function restartVoicePulse() {

    if (!voiceAudio.src) {
        return;
    }


    try {

        voiceAudio.currentTime =
            0;


        if (
            voiceAudio.paused
        ) {

            const promise =
                voiceAudio.play();


            if (
                promise &&
                promise.catch
            ) {

                promise.catch(
                    () => {}
                );

            }

        }

    }

    catch {

        /*
           Ignore browser audio timing errors.
        */

    }

}


/* ==========================================
   STOP AUDIO
========================================== */

function stopVoice() {

    voiceAudio.pause();

    voiceAudio.currentTime =
        0;

    currentVoice =
        null;

}


/* ==========================================
   EVENTS
========================================== */

function playEvent(entry) {

    clearTyping();

    stopVoice();


    dialogueText.textContent =
        "";


    characterImage.style.display =
        "none";


    eventOverlay.style.display =
        "flex";


    eventText.textContent =
        entry.text || "";


    const duration =
        Number(
            entry.duration
        ) || 1000;


    /*
       Screen shake
    */

    if (
        entry.eventType ===
        "shake"
    ) {

        shakeScreen(
            duration
        );

    }


    /*
       Laugh event

       For now this waits for the event
       duration. You can later give events
       their own audio/animation.
    */

    setTimeout(
        function() {

            eventOverlay.style.display =
                "none";


            advance();

        },
        duration
    );

}


/* ==========================================
   SCREEN SHAKE
========================================== */

function shakeScreen(duration) {

    const game =
        document.getElementById(
            "game"
        );


    const start =
        performance.now();


    function shake(time) {

        const elapsed =
            time - start;


        if (
            elapsed >=
            duration
        ) {

            game.style.transform =
                "";

            return;

        }


        const strength =
            7;


        const x =
            (Math.random() - 0.5)
            * strength;


        const y =
            (Math.random() - 0.5)
            * strength;


        game.style.transform =
            `translate(${x}px, ${y}px)`;


        requestAnimationFrame(
            shake
        );

    }


    requestAnimationFrame(
        shake
    );

}


/* ==========================================
   ADVANCE
========================================== */

function advance() {

    currentIndex++;

    playCurrentEntry();

}


/* ==========================================
   FINISH
========================================== */

function finishDialogue() {

    stopVoice();

    clearTyping();


    dialogueText.textContent =
        "";


    characterImage.style.display =
        "none";


    continueIndicator.style.display =
        "none";


    eventOverlay.style.display =
        "none";


    /*
       Leave the screen black when the
       dialogue is finished.
    */

}


/* ==========================================
   INPUT
========================================== */

function handleAdvance() {

    /*
       First tap/Enter finishes typing.
       It does NOT immediately skip to the
       next dialogue.
    */

    if (
        skipTyping()
    ) {

        return;

    }


    /*
       Text is already finished, so advance.
    */

    advance();

}


/* Keyboard */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            handleAdvance();

        }

    }
);


/* Mobile tap */

document.getElementById(
    "game"
).addEventListener(
    "click",
    function(event) {

        /*
           Don't treat the Start button as
           a dialogue tap.
        */

        if (
            startScreen.style.display !==
            "none"
        ) {

            return;

        }


        handleAdvance();

    }
);


/* ==========================================
   INITIALIZE
========================================== */

if (
    loadProject()
) {

    /*
       Project loaded successfully.
       Wait for the user to tap Start so
       mobile browsers allow audio playback.
    */

}

</script>

</body>

</html>
