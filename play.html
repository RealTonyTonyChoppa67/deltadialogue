<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Dialogue Player</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;

    background: black;

    overflow: hidden;

    color: white;

    user-select: none;
    -webkit-user-select: none;

}

body {

    display: flex;

    justify-content: center;

    align-items: flex-end;

}


/* =========================================
   GAME
========================================= */

#game {

    position: relative;

    width: 100%;
    height: 100%;

    background: black;

    display: flex;

    justify-content: center;

    align-items: flex-end;

}


/* =========================================
   DIALOGUE BOX
========================================= */

.dialogue {

    position: relative;

    width: min(
        100vw,
        1100px
    );

    margin-bottom: 12px;

    display: none;

}


.dialogue-background {

    width: 100%;

    height: auto;

    display: block;

}


/* =========================================
   CHARACTER
========================================= */

.character {

    position: absolute;

    left: 5%;

    bottom: 8%;

    width: 20%;

    height: 72%;

    object-fit: contain;

    object-position: bottom center;

    image-rendering: pixelated;

}


/* =========================================
   TEXT
========================================= */

.text {

    position: absolute;

    left: 29%;

    right: 6%;

    top: 25%;

    bottom: 18%;

    color: white;

    font-family:
        "8-bit Operator JVE",
        "Courier New",
        monospace;

    font-size:
        clamp(
            14px,
            2.4vw,
            28px
        );

    line-height: 1.35;

    white-space: pre-wrap;

    overflow: hidden;

}


/* =========================================
   CONTINUE INDICATOR
========================================= */

#continueIndicator {

    position: absolute;

    right: 3%;

    bottom: 8%;

    font-size: 18px;

    display: none;

    animation:
        blink 0.8s infinite;

}

@keyframes blink {

    50% {
        opacity: 0.2;
    }

}


/* =========================================
   EVENTS
========================================= */

#eventScreen {

    position: absolute;

    inset: 0;

    background: black;

    display: none;

    justify-content: center;

    align-items: center;

    z-index: 50;

}


.event-text {

    font-family:
        "8-bit Operator JVE",
        "Courier New",
        monospace;

    font-size:
        clamp(
            18px,
            4vw,
            40px
        );

    text-align: center;

}


/* =========================================
   START SCREEN
========================================= */

#startScreen {

    position: absolute;

    inset: 0;

    background: black;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    font-family:
        "8-bit Operator JVE",
        "Courier New",
        monospace;

    cursor: pointer;

}


#startText {

    font-size:
        clamp(
            16px,
            4vw,
            30px
        );

    animation:
        blink 1s infinite;

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .dialogue {

        width: 100%;

        margin-bottom: 5px;

    }


    .text {

        font-size:
            clamp(
                10px,
                3.2vw,
                18px
            );

    }


    .character {

        width: 21%;

    }

}

</style>

</head>


<body>


<div id="game">


    <!-- =====================================
         START SCREEN
    ====================================== -->

    <div
        id="startScreen"
    >

        <div id="startText">
            TAP TO START
        </div>

    </div>


    <!-- =====================================
         DIALOGUE
    ====================================== -->

    <div
        id="dialogue"
        class="dialogue"
    >

        <img
            class="dialogue-background"
            src="https://i.ibb.co/21Z5G7Yn/Untitled7-20260815081350.png"
            alt="Dialogue box"
        >


        <img
            id="character"
            class="character"
            src=""
            alt="Character"
        >


        <div
            id="text"
            class="text"
        ></div>


        <div
            id="continueIndicator"
        >
            ▼
        </div>

    </div>


    <!-- =====================================
         EVENT SCREEN
    ====================================== -->

    <div
        id="eventScreen"
    >

        <div
            id="eventText"
            class="event-text"
        ></div>

    </div>

</div>


<script>


/* ==================================================
   CHARACTER SPRITES
================================================== */

const characters = {

    susie: {

        neutral:
            "https://i.ibb.co/G4nYggzv/IMG-0004.jpg",

        mad:
            "https://i.ibb.co/gFHhswgR/IMG-0005.jpg",

        evil_1:
            "https://i.ibb.co/tPcV6xPn/IMG-0006.jpg",

        evil_2:
            "https://i.ibb.co/wZrZJrDd/IMG-0007.jpg",

        evil_3:
            "https://i.ibb.co/bRrjQF5B/IMG-0008.jpg",

        goofyMad:
            "https://i.ibb.co/Jj3mHthd/IMG-0009.jpg",

        awkward:
            "https://i.ibb.co/Cp225DcB/IMG-0010.jpg",

        madEvil:
            "https://i.ibb.co/5gYCTqtx/IMG-0012.jpg"

    },


    ralsei: {

        happy:
            "https://i.ibb.co/G3fVqRj7/IMG-0014.jpg",

        happyBlush:
            "https://i.ibb.co/5xxjf0kk/IMG-0013.jpg",

        shockWorried:
            "https://i.ibb.co/gMxqsXtF/IMG-0015.jpg",

        yell:
            "https://i.ibb.co/k66gNgxL/IMG-0016.jpg",

        disappoint:
            "https://i.ibb.co/4RQGNnv3/IMG-0017.jpg"

    }

};


/* ==================================================
   VOICE SOURCES
==================================================

   The OGG files are directly beside play.html.
================================================== */

const voiceSources = {

    susie:
        new Audio("susie.ogg"),

    ralsei:
        new Audio("ralsei.ogg")

};


voiceSources.susie.preload =
    "auto";

voiceSources.ralsei.preload =
    "auto";


voiceSources.susie.volume =
    0.25;

voiceSources.ralsei.volume =
    0.25;


/* ==================================================
   VOICE PLAYBACK
==================================================

   Every letter gets its own cloned audio
   instance.

================================================== */

function playVoice(
    characterName
) {

    const source =
        voiceSources[
            characterName
        ];


    if (!source) {

        return;

    }


    const audio =
        source.cloneNode(
            true
        );


    audio.volume =
        0.25;


    audio.playbackRate =
        0.95 +
        Math.random() * 0.10;


    audio.play()
        .catch(
            () => {}
        );


    audio.addEventListener(
        "ended",
        function() {

            audio.remove();

        },
        {
            once: true
        }
    );

}


/* ==================================================
   PROJECT
================================================== */

const savedProject =
    localStorage.getItem(
        "deltaruneDialogueProject"
    );


if (!savedProject) {

    document.body.innerHTML = `

        <div style="
            color:white;
            font-family:Arial;
            text-align:center;
            padding:40px;
        ">

            No dialogue project found.

        </div>

    `;

    throw new Error(
        "No dialogue project"
    );

}


let project;


try {

    project =
        JSON.parse(
            savedProject
        );

}

catch {

    document.body.innerHTML = `

        <div style="
            color:white;
            font-family:Arial;
            text-align:center;
            padding:40px;
        ">

            Invalid dialogue project.

        </div>

    `;

    throw new Error(
        "Invalid dialogue project"
    );

}


const sequence =
    project.sequence || [];


/* ==================================================
   STATE
================================================== */

let currentIndex =
    0;

let currentCharacter =
    "susie";

let currentFullText =
    "";

let textPosition =
    0;

let typing =
    false;

let typingTimer =
    null;

let eventRunning =
    false;

let gameStarted =
    false;


/* ==================================================
   ELEMENTS
================================================== */

const startScreen =
    document.getElementById(
        "startScreen"
    );


const dialogue =
    document.getElementById(
        "dialogue"
    );


const character =
    document.getElementById(
        "character"
    );


const text =
    document.getElementById(
        "text"
    );


const indicator =
    document.getElementById(
        "continueIndicator"
    );


const eventScreen =
    document.getElementById(
        "eventScreen"
    );


const eventText =
    document.getElementById(
        "eventText"
    );


/* ==================================================
   START GAME
================================================== */

function startGame() {

    if (gameStarted) {

        return;

    }


    gameStarted =
        true;


    startScreen.style.display =
        "none";


    /*
       Loading the audio here means the
       browser has already received a
       user interaction.
    */

    voiceSources.susie.load();

    voiceSources.ralsei.load();


    playCurrent();

}


/* ==================================================
   PLAY CURRENT ENTRY
================================================== */

function playCurrent() {

    if (
        currentIndex >=
        sequence.length
    ) {

        finish();

        return;

    }


    const entry =
        sequence[
            currentIndex
        ];


    if (
        entry.type ===
        "dialogue"
    ) {

        playDialogue(
            entry
        );

        return;

    }


    if (
        entry.type ===
        "event"
    ) {

        playEvent(
            entry
        );

        return;

    }


    currentIndex++;

    playCurrent();

}


/* ==================================================
   PLAY DIALOGUE
================================================== */

function playDialogue(
    entry
) {

    eventRunning =
        false;


    eventScreen.style.display =
        "none";


    dialogue.style.display =
        "block";


    currentCharacter =
        entry.character ||
        "susie";


    const spriteSet =
        characters[
            currentCharacter
        ];


    if (spriteSet) {

        character.src =
            spriteSet[
                entry.sprite
            ] ||
            Object.values(
                spriteSet
            )[0];

    }


    currentFullText =
        entry.text || "";


    textPosition =
        0;


    text.textContent =
        "";


    typing =
        true;


    indicator.style.display =
        "none";


    clearTimeout(
        typingTimer
    );


    typeNextCharacter();

}


/* ==================================================
   TYPE CHARACTER
================================================== */

function typeNextCharacter() {

    if (
        textPosition >=
        currentFullText.length
    ) {

        finishTyping();

        return;

    }


    const currentChar =
        currentFullText[
            textPosition
        ];


    text.textContent +=
        currentChar;


    textPosition++;


    /*
       Letters and numbers get voice.

       Spaces and punctuation are silent.
    */

    if (
        currentChar !== " " &&
        currentChar !== "\n" &&
        !/[.,!?;:'"()\[\]{}]/.test(
            currentChar
        )
    ) {

        playVoice(
            currentCharacter
        );

    }


    /*
       Text speed.

       45ms gives a fast,
       Deltarune-like feeling.
    */

    typingTimer =
        setTimeout(
            typeNextCharacter,
            45
        );

}


/* ==================================================
   FINISH TYPING
================================================== */

function finishTyping() {

    clearTimeout(
        typingTimer
    );


    typing =
        false;


    text.textContent =
        currentFullText;


    textPosition =
        currentFullText.length;


    indicator.style.display =
        "block";

}


/* ==================================================
   ADVANCE
================================================== */

function advance() {

    if (!gameStarted) {

        startGame();

        return;

    }


    if (eventRunning) {

        return;

    }


    /*
       If the text is still typing,
       finish it instantly.
    */

    if (typing) {

        clearTimeout(
            typingTimer
        );


        text.textContent =
            currentFullText;


        textPosition =
            currentFullText.length;


        typing =
            false;


        indicator.style.display =
            "block";


        return;

    }


    indicator.style.display =
        "none";


    currentIndex++;


    playCurrent();

}


/* ==================================================
   EVENTS
================================================== */

function playEvent(
    entry
) {

    eventRunning =
        true;


    dialogue.style.display =
        "none";


    eventScreen.style.display =
        "flex";


    eventText.textContent =
        entry.text || "";


    const duration =
        Number(
            entry.duration ||
            1000
        );


    if (
        entry.eventType ===
        "shake"
    ) {

        shakeEvent(
            duration
        );

        return;

    }


    if (
        entry.eventType ===
        "laugh"
    ) {

        laughEvent(
            duration
        );

        return;

    }


    setTimeout(
        finishEvent,
        duration
    );

}


/* ==================================================
   SHAKE
================================================== */

function shakeEvent(
    duration
) {

    const start =
        Date.now();


    function animate() {

        const elapsed =
            Date.now() -
            start;


        if (
            elapsed >=
            duration
        ) {

            document.body.style.transform =
                "";


            finishEvent();


            return;

        }


        const x =
            (
                Math.random() -
                0.5
            ) * 14;


        const y =
            (
                Math.random() -
                0.5
            ) * 14;


        document.body.style.transform =
            `translate(${x}px, ${y}px)`;


        requestAnimationFrame(
            animate
        );

    }


    animate();

}


/* ==================================================
   LAUGH
================================================== */

function laughEvent(
    duration
) {

    const start =
        Date.now();


    function animate() {

        const elapsed =
            Date.now() -
            start;


        if (
            elapsed >=
            duration
        ) {

            document.body.style.transform =
                "";


            finishEvent();


            return;

        }


        const x =
            Math.sin(
                elapsed / 40
            ) * 5;


        document.body.style.transform =
            `translateX(${x}px)`;


        requestAnimationFrame(
            animate
        );

    }


    animate();

}


/* ==================================================
   FINISH EVENT
================================================== */

function finishEvent() {

    document.body.style.transform =
        "";


    eventScreen.style.display =
        "none";


    eventRunning =
        false;


    currentIndex++;


    playCurrent();

}


/* ==================================================
   FINISH
================================================== */

function finish() {

    clearTimeout(
        typingTimer
    );


    typing =
        false;


    eventRunning =
        false;


    dialogue.style.display =
        "none";


    eventScreen.style.display =
        "none";

}


/* ==================================================
   KEYBOARD
================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key !==
            "Enter"
        ) {

            return;

        }


        event.preventDefault();


        advance();

    }
);


/* ==================================================
   MOBILE / TOUCH
================================================== */

document.addEventListener(
    "pointerdown",
    function(event) {

        if (
            event.target.closest(
                "#startScreen"
            )
        ) {

            startGame();

            return;

        }


        advance();

    }
);


/* ==================================================
   START SCREEN CLICK
================================================== */

startScreen.addEventListener(
    "click",
    function() {

        startGame();

    }
);


/* ==================================================
   INITIAL STATE
================================================== */

dialogue.style.display =
    "none";

eventScreen.style.display =
    "none";


</script>

</body>

</html>
